[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # La cámara se necesita para el escáner QR / IA
    Permissions-Policy = "camera=(self), microphone=()"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "no-cache"
